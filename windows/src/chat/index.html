<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Chat</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  input {
    box-sizing: border-box; width: calc(100% - 8px); margin: 4px; height: 44px; padding: 0 16px;
    border: 2px solid #2b1c1a; border-radius: 22px; background: #fff; color: #2b1c1a;
    font-size: 14px; outline: none; box-shadow: 0 3px 10px rgba(0,0,0,.18);
  }
</style>
</head>
<body>
<input id="box" autocomplete="off" spellcheck="true">
<script>
  const box = document.getElementById('box')
  sip.onChatOpen(({ placeholder }) => { box.placeholder = placeholder; box.value = ''; box.focus() })
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') sip.closeChat()
    if (e.key === 'Enter' && box.value.trim()) {
      sip.chat(box.value.trim())
      box.value = ''
      sip.closeChat()
    }
  })
</script>
</body>
</html>
